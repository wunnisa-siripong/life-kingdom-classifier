<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&display=swap">
<style>*{box-sizing:border-box}body{margin:0;background:transparent;color:#F2F5F0;font:16px Anuphan,Tahoma,sans-serif}.search{padding:20px;background:#29372d;border-radius:24px}label{display:flex;align-items:center;gap:12px;font-weight:600;margin-bottom:14px}.glass{width:24px;height:24px;flex-shrink:0;color:#B7D7BA}input{width:100%;border:1px solid transparent;border-radius:18px;background:#191f1b;padding:17px 18px;font:inherit;color:inherit;outline:none}input:focus{border-color:#B7D7BA}.option{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:14px;padding:12px;background:transparent;color:inherit;font:inherit;cursor:pointer}.option:hover,.option[aria-selected=true]{background:#35483a}.icon{width:28px;height:28px;flex-shrink:0}.icon svg{width:100%;height:100%}.names{flex:1;min-width:0}.names strong{display:block}.names small{color:#becdbd;display:block;overflow-wrap:anywhere}.arrow{color:#B7D7BA}.status{color:#c4d1c1;font-size:14px;margin-top:12px}.list{margin-top:12px}.option:focus-visible{outline:2px solid #B7D7BA}@media(max-width:450px){.search{padding:16px}input{padding:14px;font-size:16px}.option{padding:10px 0}.names small{font-size:13px}}</style></head>
<body><div class="search"><label for="query"><svg class="glass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg>ค้นหาสิ่งมีชีวิต</label><input id="query" role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" autocomplete="off" placeholder="เช่น มะม่วง แมว Spirogyra..."><div id="suggestions" class="list" role="listbox" aria-label="รายการแนะนำ"></div><div id="status" class="status" role="status" aria-live="polite"></div></div>
<script>
const input=document.getElementById('query'),list=document.getElementById('suggestions'),status=document.getElementById('status');let rows=[],found=[],active=-1,initialized=false,lastSelection=null;
const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
const size=()=>send('streamlit:setFrameHeight',{height:document.body.scrollHeight+2});
const norm=s=>s.normalize('NFKC').trim().replace(/\s+/g,' ').toLocaleLowerCase();
function choose(row){input.value=row.name;list.replaceChildren();input.setAttribute('aria-expanded','false');status.textContent='เลือกแล้ว · '+row.scientific;lastSelection=row.id;send('streamlit:setComponentValue',{value:row.id});size()}
function render(){const q=norm(input.value);list.replaceChildren();active=-1;input.removeAttribute('aria-activedescendant');found=[];if(q){let exact=rows.filter(r=>r.names.some(n=>norm(n)===q));found=(exact.length?exact:rows.filter(r=>r.names.some(n=>norm(n).includes(q))));found.slice(0,6).forEach((r,i)=>{let b=document.createElement('button');b.type='button';b.className='option';b.id='suggestion-'+i;b.setAttribute('role','option');b.setAttribute('aria-selected','false');let icon=document.createElement('span');icon.className='icon';icon.setAttribute('aria-hidden','true');icon.innerHTML=r.icon;let names=document.createElement('span');names.className='names';let title=document.createElement('strong');title.textContent=r.name;let sub=document.createElement('small');sub.textContent=[r.scientific,r.english].filter(Boolean).join(' · ');names.append(title,sub);let arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';b.append(icon,names,arrow);b.onclick=()=>choose(r);list.append(b)});status.textContent=found.length?'พบ '+found.length+' รายการ · เลือกชื่อเพื่อเปิดข้อมูล'+(found.length>6?' (แสดง 6 รายการแรก)':''):'ไม่พบชื่อนี้ในแค็ตตาล็อก ลองชื่ออื่น หรือใช้แท็บกำหนดคุณลักษณะเอง'}else status.textContent='ค้นด้วยชื่อไทย อังกฤษ วิทยาศาสตร์ หรือชื่อเรียกอื่น';input.setAttribute('aria-expanded',String(list.children.length>0));size()}
input.addEventListener('input',()=>{if(lastSelection!==null){lastSelection=null;send('streamlit:setComponentValue',{value:null})}render()});
input.addEventListener('keydown',e=>{let opts=[...list.children];if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!opts.length)return;active=(active+(e.key==='ArrowDown'?1:-1)+opts.length)%opts.length;opts.forEach((b,i)=>b.setAttribute('aria-selected',String(i===active)));input.setAttribute('aria-activedescendant',opts[active].id)}else if(e.key==='Enter'&&found.length){e.preventDefault();choose(found[active<0?0:active])}else if(e.key==='Escape'){list.replaceChildren();input.setAttribute('aria-expanded','false');size()}});
window.addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return;rows=e.data.args.rows;if(!initialized){initialized=true;render()}size()});new ResizeObserver(size).observe(document.body);send('streamlit:componentReady',{apiVersion:1});size();
</script></body></html>
